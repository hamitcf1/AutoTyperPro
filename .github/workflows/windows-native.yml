name: Windows native input verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  input:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pynput
      - name: Control without keyboard listener
        run: python tools/windows_native_smoke.py --without-listener
      - name: Full input and ESC check
        if: always()
        run: python tools/windows_native_smoke.py
