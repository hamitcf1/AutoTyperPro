name: Release installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release after all platform checks pass
        type: boolean
        default: false
      tag:
        description: Release tag matching the application version
        type: string
        default: v3.0.0
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Version and locale verification
        run: python tools/verify_release.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate translation catalogs
        run: python tools/check_translations.py
      - name: GUI smoke test
        run: python tools/ui_smoke.py
      - name: Native Windows input in controlled target
        if: runner.os == 'Windows'
        run: python tools/windows_native_smoke.py
      - name: Native Windows macro recording and replay
        if: runner.os == 'Windows'
        run: python tools/windows_macro_smoke.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean AutoTyperPro.spec
      - name: Windows installer and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler is missing on runner' }
          $version = python -c "from preferences import VERSION; print(VERSION)"
          & $compiler "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Compress-Archive -Path dist/AutoTyperPro -DestinationPath dist/installers/AutoTyperPro-$version-windows-x64-portable.zip
          $builtVersion = (Get-Item dist/AutoTyperPro/AutoTyperPro.exe).VersionInfo.ProductVersion
          if ($builtVersion -ne $version) { throw 'Executable version mismatch' }
          $installed = Join-Path $env:RUNNER_TEMP 'autotyper-install-test'
          $installer = Resolve-Path dist/installers/*setup.exe
          $p = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installed") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $p = Start-Process "$installed/AutoTyperPro.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed application failed: $($p.ExitCode)" }
          $p = Start-Process "$installed/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
      - name: macOS packaged launch and drag-to-install image
        if: runner.os == 'macOS'
        run: |
          python -m pip install 'ds-store>=1.3,<2' 'mac-alias>=2,<3'
          dist/AutoTyperPro.app/Contents/MacOS/AutoTyperPro --smoke-test
          codesign --verify --deep --strict dist/AutoTyperPro.app
          python tools/verify_release.py --app dist/AutoTyperPro.app
          python packaging/macos/build_dmg.py
      - name: Checksums
        run: python tools/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/installers/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version=$(python3 -c 'from preferences import VERSION; print(VERSION)')
          python3 tools/verify_release.py --tag "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" installers/* --target "$GITHUB_SHA" --title "AutoTyper Pro $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
